name: redundant-bgp-lab

topology:
  nodes:

    host1:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache iproute2 iputils traceroute
        - ip addr add 10.10.1.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace 10.20.1.0/24 via 10.10.1.1 dev eth1

    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - r1/daemons:/etc/frr/daemons
        - r1/frr.conf:/etc/frr/frr.conf
        - ./vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1

    r2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - r2/daemons:/etc/frr/daemons
        - r2/frr.conf:/etc/frr/frr.conf
        - ./vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1

    r3:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - r3/daemons:/etc/frr/daemons
        - r3/frr.conf:/etc/frr/frr.conf
        - ./vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1

    host2:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache iproute2 iputils traceroute
        - ip addr add 10.20.1.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace 10.10.1.0/24 via 10.20.1.1 dev eth1

  links:
    - endpoints: ["host1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r1:eth3", "r3:eth1"]
    - endpoints: ["r3:eth2", "r2:eth3"]
    - endpoints: ["r2:eth2", "host2:eth1"]
